[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siula"
version = "0.1.0"
description = "Read-only inspection of declared coding-agent delivery contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
siula = "siula.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/siula"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
